name: Monroe Auto Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript files
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -print0 | while IFS= read -r -d '' file; do
              echo "Checking $file"
              node --check "$file"
            done

      - name: Run Auto Changelog
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANGELOG_CHANNEL_ID: "1550471458554380298"
        run: node scripts/auto-changelog.js
